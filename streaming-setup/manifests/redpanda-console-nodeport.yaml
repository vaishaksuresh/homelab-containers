# Exposes Redpanda Console on every k3s node at :30081 so Nginx Proxy Manager
# (Docker, 10.0.20.200, outside the cluster) can proxy redpanda.heb.bet to it.
# Same pattern as k3s-setup/manifests/it-tools.yml (NodePort 30080).
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console-nodeport
  namespace: redpanda
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: redpanda
    app.kubernetes.io/name: console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
